    <!-- Google Fonts -->

<body class="bg-light">

    <!-- [S0] HEADER / NAVBAR -->

            <div class="nav-pill nav-pill-left">
                <a href="/" class="logo">
                    <span style="font-weight: 600;">Ngudi Luhur</span>

                <nav class="nav-list ms-8">

            <div class="nav-pill nav-pill-right hidden-mobile">

                    <button class="btn-filter active" data-filter="all">Semua</button>
                    <button class="btn-filter" data-filter="makanan">Makanan</button>
                    <button class="btn-filter" data-filter="minuman">Minuman</button>

                <div class="grid grid-2 grid-4-lg gap-8" id="product-grid">

            </div>

    <!-- JS Stack -->
